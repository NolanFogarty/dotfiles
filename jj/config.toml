#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Nolan Fogarty"
email = "nolan.k.fogarty@gmail.com"

[ui]
editor = "nvim"
default-command = "l"
diff-formatter = ":git"
pager = ["hunk", "pager"]
